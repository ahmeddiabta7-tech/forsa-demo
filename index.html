<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dark app shell, sticky top nav, each section is a route (#home, #dropship…) with a quiet grid and one gold accent */
:root{
  --ink:#0D0C0B; --panel:#161513; --panel-2:#1D1B18; --line:#2C2A26;
  --cream:#F2EDE4; --muted:#A39E94; --dim:#77726A;
  --gold:#C9A86A; --gold-soft:rgba(201,168,106,.14); --gold-line:rgba(201,168,106,.45);
  --good:#86BC8C; --warn:#E0AE52; --bad:#E07A62;
  --display:'Instrument Serif', Georgia, serif;
  --sans:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--cream);font-family:var(--sans);font-size:15px;line-height:1.55;padding-inline:0}
a{color:inherit}
button.tab,button.brand{border:0;background:none;padding-block:8px}
button.brand{padding:0}
button.path{text-align:left;width:100%;color:inherit;font:inherit}
button.tab{font-family:var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:clamp(16px,4vw,32px)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,8vw,104px);line-height:.98;letter-spacing:-.01em}
h1 em,h2 em{color:var(--gold)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,4.6vw,52px);line-height:1.05}
h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.lead{color:var(--muted);font-size:17px;max-width:60ch}
.muted{color:var(--muted)}

/* nav */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(13,12,11,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;flex:none}
.brand b{font-weight:800;letter-spacing:.28em;font-size:15px}
.brand span{font-family:var(--display);color:var(--gold);font-size:20px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-size:14px;font-weight:600;white-space:nowrap}
.tab:hover{color:var(--cream)}
.tab[aria-current="page"]{color:var(--ink);background:var(--cream)}
.store-pill{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:700;background:none}
.store-pill .c{background:var(--gold);color:var(--ink);border-radius:999px;min-width:20px;height:20px;display:inline-grid;place-items:center;font-size:11px;padding-inline:5px}
.demo-chip{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border:1px dashed var(--line);border-radius:6px;padding:2px 6px}

main{padding-block:40px 80px}
section.route{display:flex;flex-direction:column;gap:40px}
.head{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--cream);background:var(--cream);color:var(--ink);padding:12px 22px;border-radius:999px;font-weight:700;text-decoration:none;font-size:15px}
.btn:hover{background:var(--gold);border-color:var(--gold)}
.btn.ghost{background:none;color:var(--cream);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--cream);background:none}
.btn.sm{padding:8px 14px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--cream);background:var(--gold-soft)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--panel-2);color:var(--muted)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.good{background:rgba(134,188,140,.14);color:var(--good)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

/* home */
.hero{display:grid;grid-template-columns:1.25fr .9fr;gap:48px;align-items:end;padding-block:24px 8px}
.hero .lead{margin-top:20px}
.hero .row{margin-top:28px}
.ticket{padding:22px;display:flex;flex-direction:column;gap:14px}
.ticket .line{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding-block:8px;border-bottom:1px dashed var(--line)}
.ticket .line:last-child{border:0}
.ticket .big{font-family:var(--display);font-size:44px;color:var(--gold);line-height:1}
.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.path{padding:26px;display:flex;flex-direction:column;gap:14px;text-decoration:none;transition:border-color .2s, transform .2s}
.path:hover{border-color:var(--gold-line);transform:translateY(-2px)}
.path .who{font-size:13px;color:var(--muted)}
.path h3{font-family:var(--display);font-weight:400;font-size:32px}
.path ul{margin:0;padding-left:18px;color:var(--muted);display:grid;gap:4px}
.path .go{margin-top:auto;font-weight:700;font-size:14px;color:var(--gold)}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;counter-reset:s}
.step{padding:16px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.step b{font-size:14px}
.step::before{counter-increment:s;content:counter(s);font-family:var(--mono);color:var(--gold);font-size:12px}

/* catalog */
.product{display:flex;flex-direction:column;overflow:hidden}
.swatch{aspect-ratio:4/3;max-width:100%;position:relative;border-bottom:1px solid var(--line);background:var(--panel-2);overflow:hidden}
.swatch img{width:100%;height:100%;object-fit:cover;display:block}
.swatch .tag{background:rgba(13,12,11,.75);color:var(--cream)}
.dphoto{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.swatch .mono{font-family:var(--display);font-size:56px;color:var(--cream);opacity:.9}
.swatch .tag{position:absolute;left:12px;top:12px}
.product .body{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
.prices{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.prices div{display:flex;flex-direction:column}
.prices .v{font-size:16px;color:var(--cream)}
.product .row{margin-top:auto}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:41;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=range]{accent-color:var(--gold);width:100%}
input[type=text],input[type=number],select,textarea{background:var(--ink);border:1px solid var(--line);border-radius:10px;color:var(--cream);padding:11px 12px;font:inherit;width:100%}
textarea{min-height:90px;resize:vertical}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc .cell{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px}
.calc .cell span{display:block;font-size:12px;color:var(--muted)}
.calc .cell b{font-size:20px}
.calc .cell.hi{border-color:var(--gold-line);background:var(--gold-soft)}

/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{padding:18px;display:flex;flex-direction:column;gap:6px}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{font-size:26px;font-weight:600}
.delta{font-size:12px;font-weight:700}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.dash{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.chart{padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
svg text{font-family:var(--mono);font-size:11px;fill:var(--dim)}
.chat{display:flex;flex-direction:column;min-width:0}
.chat .log{padding:18px;display:flex;flex-direction:column;gap:12px;max-height:380px;overflow-y:auto;flex:1}
.msg{padding:12px 14px;border-radius:12px;font-size:14px;max-width:92%}
.msg.ai{background:var(--panel-2);border:1px solid var(--line)}
.msg.me{background:var(--cream);color:var(--ink);align-self:end}
.chat form{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line)}
.chat .chips{padding:0 14px 14px}

/* forms / stepper */
.stepper{display:flex;gap:8px}
.stepper div{flex:1;height:4px;border-radius:2px;background:var(--line)}
.stepper div.on{background:var(--gold)}
.form{padding:28px;display:flex;flex-direction:column;gap:18px;max-width:640px}
.err{color:var(--bad);font-size:13px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1px solid var(--line);background:var(--ink);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.opt small{color:var(--muted)}

.privacy{padding:14px 16px;border-color:var(--gold-line);background:var(--gold-soft);font-size:14px}
.sysmsg{align-self:center;font-size:12px;color:var(--warn);border:1px dashed var(--warn);border-radius:999px;padding:6px 12px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cream);color:var(--ink);padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4)}
footer{border-top:1px solid var(--line);padding-block:28px;color:var(--dim);font-size:13px}

@media (max-width:900px){
  .hero,.dash{grid-template-columns:1fr}
  .paths{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(2,1fr)}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .nav .demo-chip{display:none}
}
@media (max-width:520px){
  .nav{gap:10px}
  .brand span{display:none}
  .store-pill .t{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

V.start = () => {
  const q = state.quiz;
  const Q = [
    ['money','How much can you invest to start?',[['low','Little or nothing','Under EGP 5,000'],['mid','Some savings','EGP 5,000 to 100,000'],['high','A real budget','More than EGP 100,000']]],
    ['idea','Do you have your own product idea?',[['no','Not yet','I would rather sell what already exists'],['some','A rough idea','I know the category I like'],['yes','Yes, a clear idea','It needs funding or a team to happen']]],
    ['time','How much time can you give it?',[['side','A few hours a week','As a side income'],['part','Evenings and weekends','Growing it steadily'],['full','Full-time','This is my main job']]]
  ];
  const done = Q.every(([k])=>q[k]);
  let rec = null;
  if (done){
    if (q.idea==='yes') rec=['incubator','Get incubated','You have a clear idea. Submit it and Forsa will match you with a partner incubator for funding and mentorship.'];
    else if (q.money==='low') rec=['dropship','Dropship','Start selling partner factory products with no stock and no upfront cost. Your first payout can come within weeks.'];
    else rec=['brand','Create a brand','You have capital to invest. Work with an Egyptian factory to make a product under your own name.'];
  }
  return `<section class="route">
    <div class="head"><p class="eyebrow">Find your path</p><h2>Three questions, one recommendation</h2><p class="lead">Answer honestly. You can switch paths at any time, and many sellers start with dropshipping before creating their own brand.</p></div>
    <div class="grid g3">
      ${Q.map(([k,label,opts],i)=>`<div class="panel form" style="max-width:none"><span class="num muted" style="font-size:12px">Question ${i+1} of 3</span><h3>${label}</h3><div class="opts">${opts.map(([v,t,s])=>`<button type="button" class="opt" data-quiz="${k}" data-v="${v}" aria-pressed="${q[k]===v}"><b>${t}</b><small>${s}</small></button>`).join('')}</div></div>`).join('')}
    </div>
    ${rec?`<div class="panel" style="padding:28px;border-color:var(--gold-line);display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center"><div style="max-width:62ch"><p class="eyebrow">Your recommended path</p><h2 style="margin-top:8px">${rec[1]}</h2><p class="muted" style="margin-top:8px">${rec[2]}</p></div><button type="button" class="btn" data-go="${rec[0]}">Continue →</button></div>`
    :`<p class="muted">Answer all three questions to see your path.</p>`}
  </section>`;
};

};

function openProduct(id){
  const p = PRODUCTS.find(x=>x.id===id);
  const root = $('#drawerRoot');
  root.innerHTML = `<div class="drawer-bg" data-close></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="row" style="justify-content:space-between"><span class="tag">${p.cat}</span><button type="button" class="btn ghost sm" data-close>Close</button></div>
    <img class="dphoto" src="${PHOTOS[p.id]}" alt="${esc(p.name)}">
    <div><h2 id="dTitle" style="font-size:36px">${esc(p.name)}</h2><p class="muted" style="margin-top:6px">Made by ${fname(p.fc)} · ${p.region} · ships in ${p.ship} days</p></div>
    <div class="field"><label for="price">Your selling price: <b class="num" id="priceOut"></b></label><input id="price" type="range" min="${p.w+10}" max="${Math.round(p.w*2.5)}" step="5" value="${p.s}"></div>
    <div class="field"><label for="units">Orders you expect per month: <b class="num" id="unitsOut"></b></label><input id="units" type="range" min="1" max="200" step="1" value="30"></div>
    <div class="calc">
      <div class="cell"><span>Wholesale price</span><b class="num">${EGP(p.w)}</b></div>
      <div class="cell"><span>You earn per sale</span><b class="num" id="perSale"></b></div>
      <div class="cell hi"><span>Monthly earnings</span><b class="num" id="monthly"></b></div>
      <div class="cell"><span>Your margin</span><b class="num" id="margin"></b></div>
    </div>
    <p class="muted" style="font-size:13px">The customer pays the delivery fee on top. Forsa's 10% commission (${EGP(p.w*0.1)}) comes out of the factory's share, so it does not reduce your earnings.</p>
    <button type="button" class="btn" id="addStore">${state.store.has(p.id)?'Remove from my store':'Add to my store'}</button>
  </aside>`;
  const upd = () => {
    const price=+$('#price').value, units=+$('#units').value, per=price-p.w;
    $('#priceOut').textContent=EGP(price); $('#unitsOut').textContent=units;
    $('#perSale').textContent=EGP(per); $('#monthly').textContent=EGP(per*units);
    $('#margin').textContent=Math.round(per/price*100)+'%';
  };
  $('#price').oninput=upd; $('#units').oninput=upd; upd();
  $('#addStore').onclick=()=>{
    if(state.store.has(p.id)){state.store.delete(p.id);toast('Removed from your store');}
    else{state.store.add(p.id);toast(p.name+' added to your store');}
    saveStore(); closeDrawer(); render();
  };
  root.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeDrawer);
  $('#price').focus();
}
function closeDrawer(){ $('#drawerRoot').innerHTML=''; }

const CONTACT_RX = [
  /(\+?\d[\d\s\-().]{7,}\d)/g,
  /[\w.+-]+@[\w-]+\.[\w.]+/g,
  /\b(?:https?:\/\/|www\.)\S+/gi,
  /\b[\w-]+\.(?:com|net|org|eg|io|me|co)\b\S*/gi,
  /\b(?:whats\s?app|wa\.me|telegram|instagram|insta|facebook|fb|snap(?:chat)?|tiktok|signal|viber)\b/gi,
  /(?:واتساب|واتس|تليجرام|انستا|فيسبوك)/g
];
function maskContacts(t){ let hit=false; let out=t; CONTACT_RX.forEach(rx=>{ out=out.replace(rx,()=>{hit=true;return '[hidden by Forsa]';}); }); return {out,hit}; }
function openFactoryChat(f){
  state.fchat = state.fchat||{};
  const log = state.fchat[f.code] = state.fchat[f.code] || [{who:'f',t:'Hello, this is '+fname(f.code)+'. Ask about materials, samples, sizes or timing. Prices and payments are handled by Forsa.'}];

    root.innerHTML=`<div class="drawer-bg" data-close></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="cTitle">
      <div class="row" style="justify-content:space-between"><div><h2 id="cTitle" style="font-size:30px">${fname(f.code)}</h2><span class="muted" style="font-size:13px">${f.cat} · ${f.region} · ★ ${f.score}</span></div><button type="button" class="btn ghost sm" data-close>Close</button></div>
      <div class="panel privacy" style="font-size:13px"><b>Protected chat.</b> <span class="muted">Phone numbers, emails, links and social accounts are hidden automatically. Deals made outside Forsa lose payment protection, and factories that share contact details are penalised.</span></div>
      <div class="log" id="fLog" aria-live="polite" style="display:flex;flex-direction:column;gap:10px;flex:1;overflow-y:auto">${log.map(m=>m.who==='sys'?`<div class="sysmsg">${esc(m.t)}</div>`:`<div class="msg ${m.who==='f'?'ai':'me'}">${esc(m.t)}</div>`).join('')}</div>
      <div class="chips">${['Can I get a sample?','Which fabrics do you have?','Send me your WhatsApp number'].map(q=>`<button type="button" class="chip" data-fq="${esc(q)}">${esc(q)}</button>`).join('')}</div>
      <form id="fForm" class="row" style="flex-wrap:nowrap"><input id="fIn" type="text" placeholder="Write a message" aria-label="Message the factory"><button class="btn sm" type="submit">Send</button></form>
    </aside>`;
    root.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeDrawer);
    const lg=$('#fLog'); lg.scrollTop=lg.scrollHeight;
    const send=txt=>{
      const {out,hit}=maskContacts(txt);
      log.push({who:'me',t:out});
      if(hit){ log.push({who:'sys',t:'Contact details were hidden. Keep the deal on Forsa to stay protected.'}); }
      else {
        const l=txt.toLowerCase();
        log.push({who:'f',t:/sample/.test(l)?'Yes. A sample takes about 5 working days. Forsa will send you the sample cost to approve.'
          :/fabric|material|cotton|linen/.test(l)?'We work with Egyptian cotton, linen blends and jersey. Forsa can send you a swatch card with your sample.'
          :'Thanks, noted. We will reply here, and Forsa will add any quote to your dashboard.'});
      }
      draw();
    };
    root.querySelectorAll('[data-fq]').forEach(b=>b.onclick=()=>send(b.dataset.fq));
    $('#fForm').onsubmit=e=>{e.preventDefault();const v=$('#fIn').value.trim();if(v)send(v);};
    $('#fIn').focus();
  };

function bindIncubator(){

function lineChart(){
  const W=640,H=260,pl=56,pr=16,pt=16,pb=30;
  const max=40000, ticks=[0,10000,20000,30000,40000];
  const x=i=>pl+i*(W-pl-pr)/(DASH.months.length-1), y=v=>pt+(H-pt-pb)*(1-v/max);
  const path=a=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
  const area=path(DASH.revenue)+`L${x(5)} ${y(0)}L${x(0)} ${y(0)}Z`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Revenue and costs, April to September">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${t/1000}k</text>`).join('')}
    ${DASH.months.map((m,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${m}</text>`).join('')}
    <path d="${area}" fill="var(--gold-soft)"/>
    <path d="${path(DASH.cost)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="${path(DASH.revenue)}" fill="none" stroke="var(--gold)" stroke-width="2.5"/>
    <circle cx="${x(5)}" cy="${y(DASH.revenue[5])}" r="5" fill="var(--gold)"/>
    <text x="${x(5)-8}" y="${y(DASH.revenue[5])-12}" text-anchor="end" style="fill:var(--cream)">38.2k</text>
  </svg>`;
}

function render(){
  const r=current();
  $('#tabs').innerHTML=ROUTES.map(([k,l])=>`<button type="button" class="tab" data-go="${k}" ${k===r?'aria-current="page"':''}>${l}</button>`).join('');
  $('#app').innerHTML=V[r]();
  bind(r);
}
function bind(r){
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;render();});
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openProduct(b.dataset.open));
  document.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>{state.quiz[b.dataset.quiz]=b.dataset.v;render();});
  document.querySelectorAll('[data-fcat]').forEach(b=>b.onclick=()=>{state.fcat=b.dataset.fcat;state.factory=null;render();});
  document.querySelectorAll('[data-factory]').forEach(b=>b.onclick=()=>{state.factory=b.dataset.factory;render();});
  document.querySelectorAll('[data-svc]').forEach(b=>b.onclick=()=>{state.svc=b.dataset.svc;render();});
  document.querySelectorAll('[data-req]').forEach(b=>b.onclick=()=>{state.req.add(b.dataset.req);toast('Quote requested from '+b.dataset.req+' (demo)');render();});
  document.querySelectorAll('[data-mkt]').forEach(b=>b.onclick=()=>{state.mkt=b.dataset.mkt;render();});
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>toast('Offers open in the full platform'));
  if(r==='brand') bindBrand();
  if(r==='incubator') bindIncubator();
  if(r==='dashboard') bindDashboard();
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
$('#storeBtn').onclick=openStore;
saveStore(); render();
</script>
